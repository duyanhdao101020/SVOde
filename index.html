 [0,1].forEach(k=>T({p:'p6',scene:0,step:k,key:'p6'}));
 for(let k=0;k<=8;k++)T({p:'ga',step:k,key:k?'ga':'ga0'});
 VS[0].steps.forEach((_,k)=>T({p:'p1',scene:0,step:k,key:'p1:0'}));
 for(let k=0;k<4;k++)T({p:'gb',step:k,key:k?'gb':'gb0'});
 [0,1].forEach(k=>T({p:'px',step:k,key:'px'}));
 ['appear','fly','land','vanish'].forEach(k=>T({p:'pc',k,key:'fl'}));
 [0,1,2,3].forEach(k=>{T({p:'pc',k:'spot'+k,key:k?'sp':'spot'});if(k===0)T({p:'pc',k:'spot0a',key:'sp'})});
 T({p:'pc',k:'full',key:'full'});
 T({p:'pc',k:'thanks',key:'thanks'});
 const SEC=[['c0','封面'],['p6','复习：书包'],['ga0','结构：定语 + 的 + 中心语'],['p1:0','我喜欢吃饭'],['gb0','结构：我妈妈做的饭'],['px','为什么容易说错'],['fl','那个人是我的哥哥（飞）'],['spot','练习：聚光灯'],['thanks','谢谢']];
 $('#dots').innerHTML=TL.map(()=>'<i></i>').join('');
 $('#menu').innerHTML=SEC.map(([k,t])=>`<button data-i="${TL.findIndex(e=>e.key===k)}">${t}</button>`).join('');
 const SND={c1:'tick',c2:'appear',appear:'appear',fly:'heaven',land:'ding',vanish:'tick',spot0:'lamp',spot0a:'ding',thanks:'ding',full:'ok'},GS=['tick','tick','tick','appear','appear','ding','tick','tick','tick'],GBS=['appear','appear','appear','ding'];
 let cur={i:-1,under:null,sc:null};
 const under=(panel,scene,step)=>{if(cur.under!==panel){$('#nav button[data-p="'+panel+'"]').click();cur.under=panel}
  const A=API[panel],key=panel+':'+scene;if(cur.sc!==key){A.scene(scene);cur.sc=key}A.step(step);return A};
 function go(i){
  i=Math.max(0,Math.min(TL.length-1,i));const e=TL[i],adv=i===cur.i+1,fwd=i>cur.i;
  $('#p1-err').classList.remove('show');$('#menu').classList.remove('show');
  [['pc',pc,e.p==='pc'],['ga',ga,e.p==='ga'],['gb',gb,e.p==='gb'||e.p==='px'],['px',pxo,e.p==='px']].forEach(([k,el,v])=>el.classList.toggle('show',v));
  ty.classList.toggle('show',e.k==='thanks');
  $('#p6').classList.toggle('noduo',e.p==='ga');$('#p6').classList.toggle('up',e.p==='ga'&&e.step>=3);
  const rice=e.p==='gb'||e.p==='px';$('#p1').classList.toggle('noduo',rice);$('#p1').classList.toggle('up',rice);
  let A=null;
  if(e.p==='p1'||e.p==='p6')A=under(e.p,e.scene,e.step);
  else if(e.p==='ga'){under('p6',0,1);GA.set(e.step,adv)}
  else if(e.p==='gb'){under('p1',0,VS[0].steps.length-1);$('#p1-st .pics').className='pics on f1';GB.set(e.step)}
  else if(e.p==='px'){under('p1',0,VS[0].steps.length-1);$('#p1-st .pics').className='pics on f1';GB.set(3);PX.set(e.step,adv)}
  else{if(!cur.under)under('p6',0,0);PC.set(e.k)}
  cur.i=i;$$('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i));
  if(fwd){if(A){const S=A.S();sfx(kd(S.steps[e.step],S))}else if(e.p==='ga')sfx(GS[e.step]);else if(e.p==='gb')sfx(GBS[e.step]);else if(e.p==='pc')sfx(SND[e.k]||'tick')}
 }
 const next=()=>go(cur.i+1),prev=()=>go(cur.i-1);
 document.addEventListener('click',e=>{if(e.target.closest('#tb,#menu,.err'))return;$('#menu').classList.remove('show');next()});
 document.addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='Enter'||k==='PageDown'){e.preventDefault();next()}
  else if(k==='ArrowLeft'||k==='Backspace'||k==='PageUp'){e.preventDefault();prev()}
  else if(k==='e'||k==='E')$('#p1-warn').click();else if(k==='m'||k==='M')$('#tb-s').click();else if(k==='f'||k==='F')$('#tb-f').click();else if(k==='Escape')$('#menu').classList.remove('show')});
 $('#tb-n').onclick=next;$('#tb-p').onclick=prev;$('#tb-w').onclick=()=>$('#p1-warn').click();
 $('#tb-m').onclick=()=>$('#menu').classList.toggle('show');
 $('#tb-s').onclick=()=>{mute=!mute;$('#tb-s').textContent=mute?'🔇':'🔊'};
 $('#tb-f').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
 $$('#menu button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
 let t=null;const tb=$('#tb');const show=()=>{tb.classList.add('on');clearTimeout(t);t=setTimeout(()=>tb.classList.remove('on'),2500)};
 addEventListener('mousemove',show);addEventListener('touchstart',show,{passive:true});show();
 window.GO=go;pc.style.transition='none';go(0);requestAnimationFrame(()=>requestAnimationFrame(()=>{pc.style.transition=''}));
})();
</script>
